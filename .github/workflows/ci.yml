name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Composer ${{ matrix.composer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        composer:
          - '2.0.14'
          - '2.2.25'
          - 'stable'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer
        run: |
          if [ "${{ matrix.composer }}" = "stable" ]; then
            curl -sS https://getcomposer.org/installer | php
          else
            curl -sS https://getcomposer.org/installer | php -- --version=${{ matrix.composer }}
          fi
          sudo mv composer.phar /usr/local/bin/composer

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: composer test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer phpstan
